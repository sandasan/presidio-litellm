services:
  presidio:
    build: ./presidio-server
    container_name: presidio-server
    ports:
      - "5001:5001"
    volumes:
      - ./presidio_config.yaml:/app/presidio_config.yaml
    environment:
      - ANALYZER_CONF_FILE=/app/presidio_config.yaml
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    # Требуется больше времени для корректного завершения (сливает данные на диск)
    stop_grace_period: 40s
    ports:
      # Дашборд и API: http://127.0.0.1:20128 (изнутри сети контейнеры ходят по http://omniroute:20128)
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data
    environment:
      # V8-куча Node.js (МБ). Агентные сценарии (Hermes, Claude Code, ...)
      # с большой контекстом лучше поднять до 2048-4096.
      - OMNIROUTE_MEMORY_MB=${OMNIROUTE_MEMORY_MB:-1024}
      # Пароль админа дашборда (используется скриптом провижининга для
      # подключения провайдеров из .env через management API).
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-omniro2026!}
      # Passthrough API-ключ: тот же, что LiteLLM шлёт в Authorization.
      # Без него /v1/* отдаёт 401 клиенту (в т.ч. /v1/models).
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-sk-omniroute}
      # Облачные ключи провайдеров: OmniRoute понимает паттерн
      # {PROVIDER_ID}_API_KEY и сам подключает провайдеров для роутинга `auto`
      # (провижининг дополнительно регистрирует их в management API и создаёт
      # комбо cloud-auto).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
    healthcheck:
      # Публичный (без авторизации) эндпоинт здоровья gateway
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/monitoring/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-proxy:/app/litellm-proxy
      - ./presidio_config.yaml:/app/presidio_config.yaml
    environment:
      - PYTHONPATH=/app/litellm-proxy
      # Облачные ключи LiteLLM больше НЕ нужны: все маршруты идут к OmniRoute,
      # а провайдеры/ключи подключены там (env-паттерн {PROVIDER_ID}_API_KEY +
      # провижининг).
      # Список маршрутов LiteLLM собирается из наличия .env-ключей: всегда
      # `auto` (комбо cloud-auto, агентный пул с tool-calls) и `chat` (комбо
      # cloud-chat, широкий чат-пул для Open WebUI без требования tool-calls),
      # плюс по одному маршруту на каждого провайдера с заданным ключом
      # (комбо cloud-<provider>). В контейнер попадают только имена маршрутов,
      # не сами ключи. Соответствующие комбо создаёт provision_omniroute.sh
      # (на хосте).
      - LITELLM_ROUTES=auto,chat${MISTRAL_API_KEY:+,mistral}${GEMINI_API_KEY:+,gemini}${GROQ_API_KEY:+,groq}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-sk-omniroute}
      - PRESIDIO_ANALYZER_API_BASE=http://presidio:5001
      - PRESIDIO_ANONYMIZER_API_BASE=http://presidio:5001
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-8192}
      - LITELLM_LOG=${LITELLM_LOG:-INFO}
    depends_on:
      presidio:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    restart: unless-stopped
    # При старте контейнера генерируем config.yaml (статичный маршрут к
    # OmniRoute), затем запускаем сам LiteLLM-прокси с этим конфигом.
    entrypoint: ["/bin/sh", "-c", "python /app/litellm-proxy/generate_config.py && exec litellm --config /app/litellm-proxy/config.yaml --port 4000"]
    command: []

  hermes-agent:
    build:
      context: ..
      dockerfile: presidio-litellm/Dockerfile.hermes
    container_name: hermes-agent
    volumes:
      # Монтируем ваши проекты, чтобы агент мог работать с вашими файлами
      # Set PROJECTS_DIR in .env to any host project directory (or its parent).
      - ${PROJECTS_DIR:-/home/alexander/projects}:/workspace
      # Стабильный конфиг Hermes (модель + aux-задачи через LiteLLM/Presidio)
      - ./hermes_config.yaml:/root/.hermes/config.yaml
      # Управление доступом к каталогам: обёртка запуска, вычислитель блок-листа
      # (grants + .gitignore/.aiignore) и файл выданных грантов
      - ./hermes-chat.sh:/usr/local/bin/hermes-chat:ro
      - ./hermes-filegate.py:/usr/local/bin/hermes-filegate.py:ro
      - ./hermes_grants.json:/root/.hermes/grants.json
    environment:
      # Указываем агенту адрес LiteLLM внутри Docker-сети
      - CUSTOM_BASE_URL=http://litellm:4000/v1
      - CUSTOM_API_KEY=sk-dummy
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-dummy
      # Egress lock: весь исходящий трафик агента, кроме внутренних сервисов
      # стека, отправляется на несуществующий прокси и молча падает. LLM-запросы
      # к litellm ходят напрямую (NO_PROXY), а любые внешние вызовы (curl,
      # чужие эндпоинты aux-задач, vision/MCP, компиляторы, телеметрия) —
      # блокируются на сетевом уровне ещё до выхода из контейнера.
      # Сознательное следствие: браузер/веб-сёрфинг внутри агента не работают.
      - HTTP_PROXY=http://127.0.0.1:65533
      - HTTPS_PROXY=http://127.0.0.1:65533
      - http_proxy=http://127.0.0.1:65533
      - https_proxy=http://127.0.0.1:65533
      - NO_PROXY=litellm,presidio,omniroute,open-webui,localhost,127.0.0.1,.local
      - no_proxy=litellm,presidio,omniroute,open-webui,localhost,127.0.0.1,.local
    working_dir: /workspace
    depends_on:
      - litellm
    restart: unless-stopped

  # Чат-интерфейс в браузере поверх LiteLLM: тот же маршрут cloud-sanitized-auto,
  # та же анонимизация (Presidio-гардрейл) и де-анонимизация ответов. Это просто
  # UI чата с моделями, а НЕ агент Hermes (без его инструментов/сессий).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Прокидываем готовое подключение к LiteLLM: внутренний адрес в Docker-сети.
      # Любой ключ подойдёт (у LiteLLM не настроены virtual keys) — используем тот
      # же dummy, что и hermes-agent.
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-dummy
    depends_on:
      - litellm
    restart: unless-stopped

volumes:
  omniroute-data:
  open-webui-data: