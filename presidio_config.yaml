# presidio_config.yaml
imports: []
allow_list:
  - Java
  - PhpStorm
  - IntelliJ
  - IntelliJ IDEA
  - IntelliJ IDEA Ultimate
  - IntelliJ Platform
  - IntelliJ Platform SDK
  - JetBrains
  - Gradle
  - EspoCRM

# Кастомные детекторы — только критичные для безопасности.
# Остальное (EMAIL, PHONE, PERSON, CREDIT_CARD, IBAN, SSN, URL, IP_ADDRESS)
# покрывается встроенными распознавателями Presidio.
recognizers:
  # 1. API Ключи и Токены (Generic API Keys / Bearer / JWT)
  - name: "APIKeyRecognizer"
    supported_language: "en"
    supported_entity: "SECRET_KEY"
    patterns:
      - name: "Bearer Token"
        regex: "Bearer\\s+[A-Za-z0-9\\-\\._~\\+\\/]+=*"
        score: 0.9
      - name: "Provider API Key"
        regex: "(?i)\\b(sk-or-v1-[A-Za-z0-9_\\-]{16,}|gsk_[A-Za-z0-9_\\-]{16,}|sk-[A-Za-z0-9_\\-]{16,}|AIza[0-9A-Za-z_\\-]{35}|xai-[A-Za-z0-9_\\-]{16,})\\b"
        score: 0.95
      - name: "Generic Secret Key"
        regex: "(?i)(api[_-]?key|secret|password|token|auth)\\s*[:=]\\s*['\"]?([A-Za-z0-9_\\-]{16,})['\"]?"
        score: 0.85
      - name: "Private Key Header"
        regex: "-----BEGIN [A-Z ]+ PRIVATE KEY-----"
        score: 1.0

  # 2. Подключение к БД / очередям (Database Connection Strings)
  - name: "DbConnectionStringRecognizer"
    supported_language: "en"
    supported_entity: "DB_CONNECTION"
    patterns:
      - name: "DB Connection URI"
        regex: "(?i)(postgres|mysql|mariadb|mongodb\\+srv|mongodb|redis|oracle|mssql|sqlite):\\/\\/([^:]+):([^@]+)@([^:\\/]+):(\\d+)\\/([\\w\\-]+)"
        score: 1.0
      - name: "Queue / Warehouse URI"
        regex: "(?i)\\b(amqp|amqps|nats|kafka|rediss|clickhouse|snowflake|presto|trino):\\/\\/[^\\s<>\"']+"
        score: 0.9

  # 3. Приватные IP и внутренние сети
  - name: "InternalNetworkRecognizer"
    supported_language: "en"
    supported_entity: "INTERNAL_IP"
    patterns:
      - name: "Private IPv4"
        regex: "(?<![/@:])\\b(10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3})\\b"
        score: 0.9
      - name: "CGNAT IPv4"
        regex: "(?<![/@:])\\b100\\.(?:6[4-9]|[7-9]\\d)\\.\\d{1,3}\\.\\d{1,3}\\b"
        score: 0.85
      - name: "Loopback IPv4"
        regex: "(?<![/@:])\\b127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}\\b"
        score: 0.9
      - name: "Link-local IPv4"
        regex: "(?<![/@:])\\b169\\.254\\.\\d{1,3}\\.\\d{1,3}\\b"
        score: 0.9
      - name: "Private IPv6 (ULA)"
        regex: "(?<!/)(?<!@)(?<!\\[)\\bfd[0-9a-fA-F]{2}:[0-9a-fA-F:]+\\b"
        score: 0.9
      - name: "Link-local IPv6"
        regex: "(?<!/)(?<!@)(?<!\\[)\\bfe80:[0-9a-fA-F:]+\\b"
        score: 0.9
      - name: "Loopback IPv6"
        regex: "(?<!/)(?<!@)(?<!\\[)\\b::1\\b"
        score: 0.9
